openapi: 3.1.0

info:
  title: Wallet Service API
  description: |
    API REST para uma carteira digital, com autenticação via JWT.

    Todas as operações financeiras são atômicas (ACID) e o saldo é protegido
    contra condições de corrida (race conditions) por meio de lock pessimista.

    ## Autenticação
    A API usa **JSON Web Tokens (JWT)**. O fluxo é:
    1. `POST /register` ou `POST /login` retornam um token de acesso.
    2. Envie esse token no cabeçalho `Authorization: Bearer <token>` em todas as
       rotas protegidas.
    3. O token de acesso tem vida curta; use `POST /refresh` para obter um novo
       sem refazer o login, e `POST /logout` para invalidá-lo.

    As rotas de carteira operam **sempre sobre o usuário autenticado**: uma
    carteira pertence a quem a criou, e cada usuário só enxerga as próprias
    carteiras.

    ## Sobre valores monetários
    Todos os valores monetários trafegam em **centavos** (inteiros).
    Exemplo: `5000` representa R$ 50,00. Nunca use ponto flutuante.

    ## Sobre identificadores
    Todos os identificadores são **UUID** (versão 7).
  version: 2.0.0

servers:
  - url: http://localhost:8000/api
    description: Ambiente de desenvolvimento local (Docker)

tags:
  - name: Auth
    description: Registro, login e gerenciamento de sessão via JWT
  - name: Wallets
    description: Operações de gerenciamento e consulta de carteiras
  - name: Transactions
    description: Operações financeiras e histórico

security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [Auth]
      summary: Registra um novo usuário
      description: Cria um usuário e retorna um token de acesso já autenticado.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    description: Token JWT de acesso
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /login:
    post:
      tags: [Auth]
      summary: Autentica um usuário
      description: |
        Valida as credenciais e retorna um token de acesso. Limitado a
        5 tentativas por minuto por IP (proteção contra força bruta).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
              example:
                message: Invalid credentials
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /refresh:
    post:
      tags: [Auth]
      summary: Renova o token de acesso
      description: |
        Gera um novo token de acesso a partir do token atual (enviado no
        cabeçalho `Authorization`), sem exigir novo login.
      operationId: refresh
      responses:
        '200':
          description: Novo token gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logout:
    post:
      tags: [Auth]
      summary: Encerra a sessão
      description: Invalida o token atual, impedindo seu uso posterior.
      operationId: logout
      responses:
        '200':
          description: Logout realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallets:
    post:
      tags: [Wallets]
      summary: Cria uma nova carteira
      description: |
        Cria uma carteira com saldo inicial zero para o **usuário autenticado**.
        O dono é determinado pelo token; não é necessário (nem possível) informar
        o usuário no corpo da requisição.
      operationId: createWallet
      responses:
        '201':
          description: Carteira criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Wallets]
      summary: Lista as carteiras do usuário autenticado
      description: Retorna apenas as carteiras pertencentes ao usuário autenticado.
      operationId: listWallets
      responses:
        '200':
          description: Lista de carteiras
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallets/{id}:
    get:
      tags: [Wallets]
      summary: Busca uma carteira específica
      operationId: getWallet
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Dados da carteira
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /wallets/{id}/deposit:
    post:
      tags: [Transactions]
      summary: Realiza um depósito
      description: |
        Adiciona fundos à carteira e registra uma transação de depósito.
        A operação é atômica: ou o saldo é atualizado e a transação registrada,
        ou nada acontece.
      operationId: deposit
      parameters:
        - $ref: '#/components/parameters/WalletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Depósito realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /wallets/{id}/withdraw:
    post:
      tags: [Transactions]
      summary: Realiza um saque
      description: |
        Remove fundos da carteira, validando saldo suficiente, e registra uma
        transação de saque. A validação de saldo ocorre sob lock pessimista para
        prevenir condições de corrida. Se o saldo for insuficiente, a operação é
        revertida (rollback) e nenhum estado é alterado.
      operationId: withdraw
      parameters:
        - $ref: '#/components/parameters/WalletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Saque realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Erro de validação (valor inválido) ou saldo insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
              examples:
                saldoInsuficiente:
                  summary: Saldo insuficiente
                  value:
                    message: Insufficient balance for withdrawal.
                valorInvalido:
                  summary: Valor inválido
                  value:
                    message: The amount field must be at least 1.

  /wallets/{id}/transactions:
    get:
      tags: [Transactions]
      summary: Consulta o histórico de transações
      description: Retorna todas as transações da carteira, do registro mais antigo ao mais recente.
      operationId: getTransactions
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Histórico de transações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Envie o token JWT no cabeçalho `Authorization: Bearer <token>`."

  parameters:
    WalletId:
      name: id
      in: path
      required: true
      description: Identificador (UUID) da carteira
      schema:
        type: string
        format: uuid
      example: 019f162b-6802-733b-bcb0-da966c597334

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do usuário (UUID v7)
          example: 019f1606-46e3-7395-99e6-a87ec6140493
        name:
          type: string
          example: Rodrigo
        email:
          type: string
          format: email
          example: rodrigo@example.com
      required: [id, name, email]

    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da carteira (UUID v7)
          example: 019f162b-6802-733b-bcb0-da966c597334
        balance_in_cents:
          type: integer
          description: Saldo atual em centavos
          example: 5000
      required: [id, balance_in_cents]

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da transação (UUID v7)
          example: 019f1606-a2b8-723d-920a-70092d1a2fb9
        type:
          type: string
          description: Tipo da transação
          enum: [deposit, withdrawal]
          example: deposit
        amount_in_cents:
          type: integer
          description: Valor da transação em centavos
          example: 5000
        balance_after_in_cents:
          type: integer
          description: Saldo resultante logo após a transação, em centavos (running balance)
          example: 5000
        created_at:
          type: string
          format: date-time
          description: Momento em que a transação ocorreu (imutável)
          example: 2026-06-30T00:56:01Z
      required: [id, type, amount_in_cents, balance_after_in_cents, created_at]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: Rodrigo
        email:
          type: string
          format: email
          example: rodrigo@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: password123
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: rodrigo@example.com
        password:
          type: string
          format: password
          example: password123
      required: [email, password]

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT de acesso
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
      required: [token]

    AmountRequest:
      type: object
      properties:
        amount:
          type: integer
          minimum: 1
          description: Valor da operação em centavos (mínimo 1)
          example: 5000
      required: [amount]

    MessageError:
      type: object
      properties:
        message:
          type: string
          description: Mensagem descrevendo o erro
      required: [message]

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email has already been taken.
      required: [message]

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageError'
          example:
            message: Unauthenticated.

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageError'
          example:
            message: No query results for model [App\Models\Wallet].

    TooManyRequests:
      description: Muitas requisições (limite de tentativas excedido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageError'
          example:
            message: Too Many Attempts.

    ValidationError:
      description: Erro de validação nos dados enviados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
