name: CI

# GATILHO: quando roda
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    # SERVICE CONTAINER: um Postgres pra os testes usarem
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Baixa teu código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instala o PHP com as extensões
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_pgsql, bcmath

      # 3. Instala as dependências do Composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # 4. Prepara o ambiente de teste
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # 5. Roda as migrations no banco de teste
      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wallet_test
          DB_USERNAME: root
          DB_PASSWORD: root

      # 6. Roda os testes
      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wallet_test
          DB_USERNAME: root
          DB_PASSWORD: root